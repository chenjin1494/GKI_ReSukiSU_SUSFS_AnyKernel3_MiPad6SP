name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_ready: ${{ steps.readiness.outputs.release_ready }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.6.0
        with:
          python-version: '3.x'
      - name: Check shell syntax when implementation exists
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f scripts/build.sh ]]; then
            bash -n scripts/build.sh
            while IFS= read -r -d '' script; do bash -n "$script"; done < <(find scripts -type f -name '*.sh' -print0)
          else
            echo "scripts/build.sh is not implemented; build jobs remain blocked"
          fi
      - name: Run Python unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d tests ]]; then
            python3 -m unittest discover -s tests -p 'test_*.py' -v
          else
            echo "No tests directory; no Python tests to run"
          fi
      - name: Check pinned CVE patch applicability
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/check_cve_candidate.py
      - name: Check pinned ReSukiSU driver links and inline hooks
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/check_resukisu_candidate.py
      - name: Check pinned BBG security linkage
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/check_bbg_candidate.py
      - name: Check pinned SUSFS patch applicability
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/check_susfs_candidate.py
      - name: Check pinned ZRAM patch ordering
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/check_zram_candidate.py
      - name: Report release readiness
        id: readiness
        shell: bash
        run: |
          set -Eeuo pipefail
          if python3 scripts/build.py --check; then
            echo 'release_ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'release_ready=false' >> "$GITHUB_OUTPUT"
            echo 'release preflight blocked: implementation or source evidence is incomplete'
          fi

  build:
    name: Build (${{ matrix.profile }})
    needs: validate
    if: ${{ needs.validate.outputs.release_ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        profile: [stock, enhanced]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build kernel package
        shell: bash
        env:
          NETWORK_PROFILE: ${{ matrix.profile }}
        run: |
          set -Eeuo pipefail
          bash scripts/build.sh --network-profile "$NETWORK_PROFILE"
      - name: Verify build output
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d dist
          test -n "$(find dist -type f -print -quit)"
      - name: Upload build output
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: dist-${{ matrix.profile }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
